name: ActiveMemory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      # One old version failing should not hide a failure on the newest.
      fail-fast: false
      matrix:
        include:
          - elixir: '1.15'
            otp: '26.2'
          - elixir: '1.17'
            otp: '27.2'
          - elixir: '1.19'
            otp: '28.0'
          - elixir: '1.20'
            otp: '28.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  lint:
    name: Format and warnings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Formatting and the type checker both change between releases, so they are
      # checked on the newest supported Elixir only rather than across the matrix.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.20'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-lint-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors --force